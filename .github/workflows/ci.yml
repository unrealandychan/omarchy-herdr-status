name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: shellcheck
        run: shellcheck install.sh uninstall.sh scripts/*.sh
      - name: qmllint
        # Omarchy's qs.* modules are not available in CI, so import-related checks are disabled.
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq qt6-declarative-dev-tools
          /usr/lib/qt6/bin/qmllint --import disable --unqualified disable --unresolved-type disable plugin/*.qml
      - name: versions in sync
        run: |
          cargo_version=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          manifest_version=$(jq -r .version manifest.json)
          echo "Cargo.toml=$cargo_version manifest.json=$manifest_version"
          test "$cargo_version" = "$manifest_version"
